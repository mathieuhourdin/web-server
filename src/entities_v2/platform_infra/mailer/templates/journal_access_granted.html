<p class="email-greeting">Bonjour {{recipient_display_name}},</p>
<h1 class="email-title">Un journal à découvrir</h1>
<p class="email-copy"><strong>{{owner_display_name}}</strong> vous a donné accès au journal <strong>{{journal_title}}</strong>.</p>
<p class="email-copy">Ses traces sont maintenant à votre disposition, à lire à votre rythme.</p>
<table role="presentation" class="email-action" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="email-button-cell"><a class="email-button" href="{{journal_url}}">Ouvrir le journal</a></td></tr>
</table>
