<p class="email-greeting">Bonjour {{recipient_display_name}},</p>
<h1 class="email-title">Votre retour du jour</h1>
<p class="email-copy"><strong>{{mentor_display_name}}</strong> a pris un moment pour revenir sur vos écrits.</p>
<p class="email-kicker">Le retour de votre mentor</p>
<div class="email-excerpt">{{feedback_preview_html}}</div>
<h2 class="email-section">Votre journée en quelques lignes</h2>
<p class="email-copy"><strong>{{recap_title}}</strong><br>{{recap_preview_html}}</p>
<table role="presentation" class="email-action" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="email-button-cell"><a class="email-button" href="{{recap_url}}">Lire le retour complet</a></td></tr>
</table>
