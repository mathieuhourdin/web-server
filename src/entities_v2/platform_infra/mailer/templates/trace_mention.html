<p class="email-greeting">Bonjour {{recipient_display_name}},</p>
<h1 class="email-title">{{owner_display_name}} vous a mentionné</h1>
<p class="email-copy">Vous apparaissez dans une trace partagée sur hupo.</p>
<p class="email-meta"><a class="email-link" href="{{journal_url}}">{{journal_title}}</a><br>{{interaction_date}}</p>
<p class="email-kicker">Un aperçu de la trace</p>
<div class="email-excerpt">{{excerpt_html}}</div>
<table role="presentation" class="email-action" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="email-button-cell"><a class="email-button" href="{{journal_url}}">Lire la trace</a></td></tr>
</table>
