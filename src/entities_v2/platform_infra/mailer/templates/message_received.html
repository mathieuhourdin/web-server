<p class="email-greeting">Bonjour {{recipient_display_name}},</p>
<h1 class="email-title">{{sender_display_name}} vous a écrit</h1>
<p class="email-copy">Un nouveau message vous attend sur hupo.</p>
<p class="email-kicker">Un aperçu du message</p>
<div class="email-excerpt">{{excerpt_html}}</div>
<table role="presentation" class="email-action" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="email-button-cell">{{conversation_link_html}}</td></tr>
</table>
<p class="email-small">Retrouvez la conversation pour lire la suite et répondre.</p>
