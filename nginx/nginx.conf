events {
    worker_connections 1024;
}

http {
    client_max_body_size 30M;

    # BEGIN HUPO REQUEST OBSERVABILITY (also install inside production http {})
    # The optional client ID is diagnostic only. Reject neither missing nor
    # malformed IDs; use nginx's random 32-hex ID instead (accepted by Rust).
    map $http_x_request_id $hupo_request_id {
        default $request_id;
        "~*^(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$" $http_x_request_id;
    }
    # Timings are strings because unavailable values are '-' and upstream
    # retries can produce several values. Do not log queries, tokens or bodies.
    log_format hupo_timing escape=json
        '{"timestamp":"$time_iso8601","level":"INFO","target":"nginx",'
        '"message":"http_proxy_request_completed","request_id":"$hupo_request_id",'
        '"http_method":"$request_method","http_route":"$uri","host":"$host",'
        '"status_code":$status,"body_bytes_sent":$body_bytes_sent,'
        '"request_time_s":"$request_time",'
        '"upstream_connect_time_s":"$upstream_connect_time",'
        '"upstream_header_time_s":"$upstream_header_time",'
        '"upstream_response_time_s":"$upstream_response_time",'
        '"request_completion":"$request_completion"}';
    access_log /dev/stdout hupo_timing;
    # END HUPO REQUEST OBSERVABILITY

    server {
        listen 80;
        server_name example.com www.example.com;

        # Redirect all HTTP traffic to HTTPS
        location / {
        proxy_pass http://web-server:3000;  # Or any other service you want to expose via HTTP
        proxy_set_header X-Request-Id $hupo_request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name example.com www.example.com;

        # SSL certificates
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH;

        location / {
            # Proxy to your Rust backend or any application running on Docker or outside
            proxy_pass http://web-server:3000;
            proxy_set_header X-Request-Id $hupo_request_id;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
