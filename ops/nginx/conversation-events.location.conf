# Install inside the API's server {} block, not at nginx's top level.
# Keep the upstream and observability variable aligned with that server's config.
location = /me/conversation_events {
    proxy_pass http://web-server:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Request-Id $hupo_request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 75s;
}
